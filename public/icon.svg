<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sword" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>
  
  <!-- Chart lines -->
  <path d="M 50 350 L 150 280 L 250 320 L 350 200 L 450 250" 
        stroke="#3b82f6" stroke-width="4" fill="none" opacity="0.3"/>
  <path d="M 50 380 L 150 320 L 250 350 L 350 250 L 450 280" 
        stroke="#8b5cf6" stroke-width="4" fill="none" opacity="0.3"/>
  
  <!-- Sword/Duel symbol -->
  <g transform="translate(256, 256)">
    <!-- Left sword -->
    <path d="M -80 -100 L -60 -80 L -60 80 L -80 100 L -100 80 L -100 -80 Z" 
          fill="url(#sword)" opacity="0.9"/>
    <rect x="-90" y="-20" width="20" height="40" fill="#FFD700"/>
    
    <!-- Right sword -->
    <path d="M 80 -100 L 60 -80 L 60 80 L 80 100 L 100 80 L 100 -80 Z" 
          fill="url(#sword)" opacity="0.9"/>
    <rect x="70" y="-20" width="20" height="40" fill="#FFD700"/>
    
    <!-- Center clash -->
    <circle cx="0" cy="0" r="30" fill="#FFD700" opacity="0.8"/>
    <text x="0" y="10" font-size="40" font-weight="bold" fill="#0a0e14" text-anchor="middle" font-family="Arial">⚔</text>
  </g>
  
  <!-- Text -->
  <text x="256" y="450" font-size="48" font-weight="bold" fill="#FFD700" text-anchor="middle" font-family="Arial, sans-serif">PipDuel</text>
</svg>
